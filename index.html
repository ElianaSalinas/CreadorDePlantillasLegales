<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var _activeFetch = originalFetch.bind(window);
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return _activeFetch;
                },
                set: function(newFetch) {
                  _activeFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}

            try {
              if (typeof Window !== 'undefined' && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return _activeFetch;
                  },
                  set: function(newFetch) {
                    _activeFetch = newFetch;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (err) {}
          }
        } catch (e) {
          console.warn('Fetch setter init:', e);
        }
      })();
    </script>
